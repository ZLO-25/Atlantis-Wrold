<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Atlantis</title><style>body,html{margin:0;height:100%;background:#020818;overflow:hidden;font:14px/1.4 system-ui,sans-serif;color:#bfeaf0;touch-action:none;user-select:none}canvas{position:fixed;inset:0;width:100%;height:100%;display:block;background:#020818}#msg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;background:radial-gradient(#0b3a4a,#020818)}#msg h1{font-weight:300;font-size:26px;margin:0 0 8px;color:#7ff0ff}#msg p{max-width:480px;margin:0 auto;opacity:.8}#fade{position:fixed;inset:0;background:#020818;transition:opacity 1.6s;display:flex;align-items:center;justify-content:center;pointer-events:none;color:#5cc;letter-spacing:.3em;font-size:12px}#hud{position:fixed;left:16px;bottom:14px;font-size:12px;opacity:.8;transition:opacity 2s;pointer-events:none;text-shadow:0 0 6px #012}#stick{display:none;position:fixed;width:100px;height:100px;border-radius:50%;border:2px solid #7ff3;background:#0ff1;pointer-events:none}#knob{position:absolute;left:30px;top:30px;width:40px;height:40px;border-radius:50%;background:#7ff6}.b{display:none;position:fixed;right:16px;width:54px;height:54px;border-radius:50%;background:#0ff2;border:2px solid #7ff4;color:#bff;font-size:22px;text-align:center;line-height:54px}</style></head><body><canvas id="c"></canvas><div id="fade">ATLANTIS</div><div id="hud">WASD move &middot; mouse look (click to capture) &middot; Q/E down/up &middot; Shift faster &middot; touch: left stick, drag to look</div><div id="stick"><div id="knob"></div></div><div class="b" id="up" style="bottom:90px">&#9650;</div><div class="b" id="dn" style="bottom:24px">&#9660;</div><div id="msg"></div><script>const e="\nstruct G{vp:mat4x4f,sv:mat4x4f,cam:vec4f,fwd:vec4f,rgt:vec4f,upv:vec4f,sun:vec4f,k:vec4f,q:vec4f,sch:array<vec4f,40>};\n@group(0)@binding(0)var<uniform> g:G;\nconst SIG=vec3f(0.036,0.0145,0.0098);\n",t="\nfn wpi(p:vec3f,r0:vec4f,r1:vec4f,r2:vec4f)->vec3f{let h=vec4f(p,1.0);return vec3f(dot(r0,h),dot(r1,h),dot(r2,h));}\nfn nmi(n:vec4f,r0:vec4f,r1:vec4f,r2:vec4f)->vec3f{return normalize(vec3f(dot(r0.xyz,n.xyz),dot(r1.xyz,n.xyz),dot(r2.xyz,n.xyz)));}\n",n=e+t+"\n@vertex fn vsSh(@location(0)p:vec3f,@location(1)n:vec4f,@location(2)q:vec4f,@location(3)r0:vec4f,@location(4)r1:vec4f,@location(5)r2:vec4f,@location(6)ip:vec4f)->@builtin(position)vec4f{\n return g.sv*vec4f(wpi(p,r0,r1,r2),1.0);}\n",o=e+t+"\n@group(0)@binding(1)var shT:texture_depth_2d;\n@group(0)@binding(2)var shS:sampler_comparison;\n@group(0)@binding(3)var lgT:texture_2d<u32>;\n@group(0)@binding(4)var<storage,read>lts:array<vec4f>;\n\nstruct VO{@builtin(position)@invariant pos:vec4f,@location(0)wp:vec3f,@location(1)n:vec3f,@location(2)q:vec4f,@location(3)@interpolate(flat)ip:vec4f};\nstruct FI{@location(0)wp:vec3f,@location(1)n:vec3f,@location(2)q:vec4f,@location(3)@interpolate(flat)ip:vec4f};\n\n@vertex fn vsS(@location(0)p:vec3f,@location(1)n:vec4f,@location(2)q:vec4f,@location(3)r0:vec4f,@location(4)r1:vec4f,@location(5)r2:vec4f,@location(6)ip:vec4f)->VO{\n var o:VO;let w=wpi(p,r0,r1,r2);o.wp=w;o.n=nmi(n,r0,r1,r2);o.pos=g.vp*vec4f(w,1.0);o.q=q;o.ip=ip;return o;}\n@vertex fn vsP(@location(0)p:vec3f,@location(1)n:vec4f,@location(2)q:vec4f,@location(3)r0:vec4f,@location(4)r1:vec4f,@location(5)r2:vec4f,@location(6)ip:vec4f)->@builtin(position)@invariant vec4f{\n return g.vp*vec4f(wpi(p,r0,r1,r2),1.0);}\n@vertex fn vsV(@location(0)p:vec3f,@location(1)n:vec4f,@location(2)q:vec4f,@location(3)r0:vec4f,@location(4)r1:vec4f,@location(5)r2:vec4f,@location(6)ip:vec4f)->VO{\n var o:VO;var w=wpi(p,r0,r1,r2);let t=g.cam.w;let hq=q.x;let ph=w.x*0.17+w.z*0.13;let a=ip.w*hq*hq;\n w.x+=sin(t*0.8+ph+hq*3.0)*a;w.z+=cos(t*0.65+ph*1.3+hq*2.2)*a;\n o.wp=w;o.n=nmi(n,r0,r1,r2);o.pos=g.vp*vec4f(w,1.0);o.q=q;o.ip=ip;return o;}\n\nfn hv3(n:u32)->vec3f{var x=vec3u(n*747796405u+2891336453u,n*2654435761u+97u,n*1597334677u+13u);\n x=x^(x>>vec3u(16u));x=x*vec3u(2246822519u,3266489917u,668265263u);x=x^(x>>vec3u(15u));x=x*vec3u(1274126177u,2654435761u,2246822519u);x=x^(x>>vec3u(13u));\n return vec3f(x)*2.3283064e-10;}\nfn fishPos(id:u32,t:f32)->vec3f{\n let s=id%6u;let A=g.sch[s];let B=g.sch[6u+s];let h=hv3(id);\n let a=t*B.x+B.y;\n let c=A.xyz+vec3f(cos(a)*A.w,sin(a*1.7+B.y)*A.w*0.12,sin(a)*A.w*0.8);\n let off=(h-0.5)*vec3f(2.0,0.9,2.0)*B.w;\n let wob=vec3f(sin(t*0.9+h.x*40.0),sin(t*0.7+h.y*40.0)*0.5,cos(t*0.8+h.z*40.0))*B.w*0.22;\n return c+off+wob;}\n@vertex fn vsF(@location(0)p:vec3f,@location(1)n:vec4f,@location(2)q:vec4f,@builtin(instance_index)ii:u32)->VO{\n var o:VO;let t=g.cam.w;let s=ii%6u;let B=g.sch[6u+s];let h=hv3(ii);\n let p0=fishPos(ii,t);let p1=fishPos(ii,t+0.1);let f=normalize(p1-p0+vec3f(0.0001,0.0,0.0));\n let sd=normalize(cross(f,vec3f(0.0,1.0,0.0)));let up=cross(sd,f);\n let sz=B.z*(0.8+0.5*h.x)*smoothstep(4.0,11.0,length(p0-g.cam.xyz));\n var lp=p;lp.z+=sin(q.x*6.0-t*9.0+h.y*20.0)*0.09*q.x*q.x*(1.0+q.x);\n let w=p0+(f*lp.x+up*lp.y+sd*lp.z)*sz;\n let nn=normalize(f*n.x+up*n.y+sd*n.z);\n o.wp=w;o.n=nn;o.pos=g.vp*vec4f(w,1.0);o.q=q;o.ip=vec4f(10.0,fract(f32(s)*0.19+0.02),0.0,0.0);return o;}\nfn mantaPos(id:u32,t:f32)->vec3f{let A=g.sch[12u+id];let B=g.sch[18u+id];let a=t*B.x+B.y;\n return A.xyz+vec3f(cos(a)*A.w,sin(a*2.0)*3.0,sin(a)*A.w*0.85);}\n@vertex fn vsM(@location(0)p:vec3f,@location(1)n:vec4f,@location(2)q:vec4f,@builtin(instance_index)ii:u32)->VO{\n var o:VO;let t=g.cam.w;let B=g.sch[18u+ii];\n let p0=mantaPos(ii,t);let p1=mantaPos(ii,t+0.4);var f=normalize(p1-p0+vec3f(0.0001,0.0,0.0));if(B.x<0.0){f=-f;}\n let sd=normalize(cross(f,vec3f(0.0,1.0,0.0)));let up=cross(sd,f);\n var lp=p;let zz=q.x;lp.y+=sin(t*1.3-zz*2.2+B.y)*1.5*pow(zz,1.5);\n let w=p0+(f*lp.x+up*lp.y+sd*lp.z)*B.z;\n let nn=normalize(f*n.x+up*n.y+sd*n.z);\n o.wp=w;o.n=nn;o.pos=g.vp*vec4f(w,1.0);o.q=q;o.ip=vec4f(11.0,0.55,0.0,0.0);return o;}\n\nfn hh(p:vec3f)->f32{let q=bitcast<vec3u>(vec3i(floor(p)));var h=q.x*374761393u+q.y*668265263u+q.z*2147483647u;h=(h^(h>>13u))*1274126177u;return f32(h^(h>>16u))*2.3283064e-10;}\nfn n3(x:vec3f)->vec4f{\n let i=floor(x);let f=fract(x);\n let u=f*f*f*(f*(f*6.0-15.0)+10.0);let du=30.0*f*f*(f*(f-2.0)+1.0);\n let a=hh(i);let b=hh(i+vec3f(1.0,0.0,0.0));let c=hh(i+vec3f(0.0,1.0,0.0));let d=hh(i+vec3f(1.0,1.0,0.0));\n let e=hh(i+vec3f(0.0,0.0,1.0));let ff=hh(i+vec3f(1.0,0.0,1.0));let gg=hh(i+vec3f(0.0,1.0,1.0));let h=hh(i+vec3f(1.0,1.0,1.0));\n let k1=b-a;let k2=c-a;let k3=e-a;let k4=a-b-c+d;let k5=a-c-e+gg;let k6=a-b-e+ff;let k7=-a+b+c-d+e-ff-gg+h;\n let v=a+k1*u.x+k2*u.y+k3*u.z+k4*u.x*u.y+k5*u.y*u.z+k6*u.z*u.x+k7*u.x*u.y*u.z;\n let dv=du*vec3f(k1+k4*u.y+k6*u.z+k7*u.y*u.z,k2+k5*u.z+k4*u.x+k7*u.z*u.x,k3+k6*u.x+k5*u.y+k7*u.x*u.y);\n return vec4f(v,dv);}\nfn fb(p:vec3f)->vec4f{var s=vec4f(0.0);var a=0.5;var q=p;var fq=1.0;\n for(var i=0;i<3;i++){let n=n3(q);s+=a*vec4f(n.x,n.yzw*fq);q=q*2.03+vec3f(1.7,9.2,3.1);a*=0.5;fq*=2.03;}\n return s;}\nfn caust(p0:vec2f,t:f32)->f32{\n let p=p0-6.2831853*floor(p0/6.2831853)-250.0;\n var i=p;var c=1.0;let inten=0.005;\n for(var n=0;n<3;n++){let tt=t*(1.0-3.5/f32(n+1));\n  i=p+vec2f(cos(tt-i.x)+sin(tt+i.y),sin(tt-i.y)+cos(tt+i.x));\n  c+=1.0/length(vec2f(p.x/(sin(i.x+tt)/inten),p.y/(cos(i.y+tt)/inten)));}\n c/=3.0;c=1.17-pow(c,1.4);return pow(abs(c),8.0);}\nfn hc(h:f32)->vec3f{var a=array<vec3f,8>(vec3f(1.0,0.72,0.2),vec3f(1.0,0.4,0.18),vec3f(1.0,0.12,0.6),vec3f(0.55,0.22,1.0),vec3f(0.18,0.45,1.0),vec3f(0.1,0.85,1.0),vec3f(0.2,1.0,0.65),vec3f(1.0,0.72,0.2));\n let x=fract(h)*7.0;let i=i32(x);return mix(a[i],a[min(i+1,7)],fract(x));}\nfn fogC(d:vec3f,y:f32)->vec3f{\n let yy=clamp(y/90.0,0.0,1.0);let up=clamp(d.y*0.5+0.5,0.0,1.0);\n let deep=vec3f(0.003,0.008,0.045);let teal=vec3f(0.005,0.05,0.11);let cy=vec3f(0.09,0.46,0.60);\n var c=mix(deep,teal,smoothstep(0.05,0.8,yy*0.7+(up-0.5)*0.9+0.2));\n c=mix(c,cy,smoothstep(0.62,1.2,yy*0.5+up*0.
